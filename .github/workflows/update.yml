name: update

# Daily: move nixpkgs to the latest nixos-unstable channel. The lock is always
# committed (this also keeps the repo active, so GitHub never disables the
# schedule). A new image is built and published only when the image itself
# changed, i.e. when its Nix store path differs from the previous lock's.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Image store paths before
        run: |
          for s in x86_64-linux aarch64-linux; do
            nix eval --raw .#packages.$s.image.outPath; echo
          done > /tmp/before

      - name: Update nixpkgs
        run: nix flake update

      - name: Image store paths after
        id: diff
        run: |
          for s in x86_64-linux aarch64-linux; do
            nix eval --raw .#packages.$s.image.outPath; echo
          done > /tmp/after
          diff /tmp/before /tmp/after && changed=false || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit lock
        id: commit
        run: |
          if git diff --quiet flake.lock; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="chore: update nixpkgs"
          [ "${{ steps.diff.outputs.changed }}" = true ] && msg="$msg (image changed)"
          git commit -am "$msg"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit
